name: release

on:
  release:
    types: [published]

# Least privilege by default; each job widens only what it actually needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # No docker/setup-qemu-action here, deliberately. The audit flagged that
      # the linux/arm64 build ran `apk add` in the *target* stage, which needs
      # binfmt handlers this workflow never registered. The Dockerfile has since
      # been restructured so the build stage is pinned to $BUILDPLATFORM and
      # cross-compiles, and the runtime stage contains no RUN at all - the CA
      # bundle is COPY'd out of the build stage instead of apk-installed. Adding
      # any RUN to the runtime stage re-breaks arm64 on an amd64 runner; register
      # QEMU here if that ever becomes necessary.
      - name: set-up-docker-buildx
        uses: docker/setup-buildx-action@v3

      - name: login-to-ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract-metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is gated on the release not being a pre-release.
          # Unconditionally, publishing a pre-release - or re-publishing an old
          # patch release - silently repointed the tag everyone pulls at a
          # version that is not the newest stable one.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # The Dockerfile stamps this into main.version via -ldflags; without
          # it every published image reports itself as "dev".
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-helm-chart:
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10

    # This job never touches *this* repository: it authenticates to
    # kontrolplane/helm-charts with a GitHub App token and does all its work
    # there. It therefore needs nothing at all from GITHUB_TOKEN. Without this
    # block it silently inherited the repository default, which for many repos
    # is still read/write on every scope.
    permissions: {}

    steps:
      - name: generate-token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: kontrolplane
          repositories: helm-charts

      - name: checkout-helm-charts
        uses: actions/checkout@v4
        with:
          repository: kontrolplane/helm-charts
          token: ${{ steps.app-token.outputs.token }}

      - name: bump-versions
        id: bump
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"

          # read current chart version and bump patch
          CURRENT=$(grep '^version:' feed/Chart.yaml | awk '{print $2}')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          CHART_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          sed -i "s/^version:.*/version: ${CHART_VERSION}/" feed/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" feed/Chart.yaml

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Updated appVersion to ${APP_VERSION}, chart version to ${CHART_VERSION}"
          cat feed/Chart.yaml

      - name: create-pull-request
        run: |
          APP_VERSION="${{ steps.bump.outputs.app_version }}"
          CHART_VERSION="${{ steps.bump.outputs.chart_version }}"
          BRANCH="feed/v${APP_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add feed/Chart.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(feed): bump to app ${APP_VERSION}, chart ${CHART_VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --repo kontrolplane/helm-charts \
            --base main \
            --head "$BRANCH" \
            --title "feed: bump to v${APP_VERSION}" \
            --body "$(cat <<EOF
          Automated bump triggered by [kontrolplane/feed v${APP_VERSION}](https://github.com/kontrolplane/feed/releases/tag/v${APP_VERSION}).

          - **appVersion**: \`${APP_VERSION}\`
          - **chart version**: \`${CHART_VERSION}\`
          EOF
          )"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
