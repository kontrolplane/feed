# Self-hosting quickstart, PostgreSQL backend.
#
# Create a .env next to this file (.env is gitignored) before starting:
#
#   DATABASE_PASSWORD=<something long and random>
#
#   docker compose -f docker-compose.postgres.yaml up -d

services:
  feed:
    # Finding 22: was `build: .`. Use docker-compose.build.yaml as an overlay to
    # build from this checkout instead.
    image: ghcr.io/kontrolplane/feed:latest
    ports:
      - "8080:8080"
    environment:
      - DATABASE_DRIVER=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=feed
      - DATABASE_USER=feed
      # Finding 22: no hardcoded credential. `:?` makes compose refuse to start
      # rather than silently fall back to a well-known password.
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      - DATABASE_SSL_MODE=disable
      - REFRESH_INTERVAL=15m
      - MARK_READ_ON=open
      - RETENTION=30d
      - DENSITY=default
      # DEVELOPMENT_SEED deliberately absent — see docker-compose.yaml.
    depends_on:
      postgres:
        condition: service_healthy
    # Nothing is written to the container filesystem on the postgres path; /tmp
    # is provided because modernc/pgx and the stdlib may use TMPDIR.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      # Bound to loopback: the database is only for the feed service.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=feed
      - POSTGRES_USER=feed
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    command: ["postgres", "-c", "log_min_messages=FATAL"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    # Not read_only and not cap_drop: ALL — the official postgres entrypoint
    # chowns and chmods its data directory and drops privileges itself, so it
    # needs a writable rootfs plus CHOWN/SETUID/SETGID/FOWNER/DAC_OVERRIDE.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

volumes:
  pg-data:
